<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Informasi - Portal Pembelajaran</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================
           RESET & GLOBALS
        ========================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            position: relative;
            overflow-x: hidden;
            opacity: 0;
            animation: pageFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* =========================
           AMBIENT BACKGROUND ORBS
        ========================= */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            will-change: transform;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            top: -100px;
            right: -50px;
            animation: float 20s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: #6366f1;
            bottom: -100px;
            left: -50px;
            animation: float 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, 50px) scale(1.1); }
        }

        /* =========================
           HEADER
        ========================= */
        header {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-button {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            padding: 9px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .brand {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================
           CONTAINER & PAGE HEADER
        ========================= */
        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 30px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(79, 70, 229, 0.15));
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 28px;
            border-radius: 24px;
            margin-bottom: 24px;
            animation: slideUp 0.6s ease both;
        }

        .page-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 14.5px;
            line-height: 1.6;
        }

        /* =========================
           SEARCH & FILTER (GLASS)
        ========================= */
        .search-box {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 24px;
            animation: slideUp 0.7s ease 0.1s both;
        }

        .search-wrapper { position: relative; margin-bottom: 16px; }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #94a3b8;
        }

        .search-input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 16px 14px 44px;
            border-radius: 14px;
            font-size: 14.5px;
            color: #f8fafc;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input::placeholder { color: #64748b; }
        .search-input:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .filter-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-button.active {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .result-info {
            color: #94a3b8;
            font-size: 13.5px;
            margin-bottom: 16px;
            font-weight: 500;
            padding-left: 4px;
        }

        /* =========================
           CARDS (GLASSMORPHISM)
        ========================= */
        .announcement-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .announcement-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease both;
        }

        .announcement-card:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .announcement-card.pinned {
            border: 1px solid rgba(245, 158, 11, 0.4);
            background: rgba(245, 158, 11, 0.05);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .card-badges { display: flex; gap: 8px; flex-wrap: wrap; }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        
        .badge-info { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-tugas { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-pengumuman { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-pinned { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); }

        .card-title {
            font-size: 19px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-message {
            color: #cbd5e1;
            font-size: 14.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .card-meta {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }
        
        .card-meta strong { color: #94a3b8; font-weight: 600; }

        /* =========================
           STATES (EMPTY/LOADING)
        ========================= */
        .empty, .loading, .error {
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 14.5px;
        }

        .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.8; }
        .error { color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        /* =========================
           LOCKED MODAL
        ========================= */
        .locked-message {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 99999;
        }

        .locked-message.show { display: flex; animation: pageFadeIn 0.3s ease; }

        .locked-box {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .locked-icon { font-size: 48px; margin-bottom: 16px; }
        .locked-box h2 { color: #f8fafc; font-size: 22px; margin-bottom: 12px; }
        .locked-box p { color: #94a3b8; font-size: 14.5px; line-height: 1.6; margin-bottom: 24px; }
        
        .locked-box button {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .locked-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); }

        /* =========================
           ANIMATIONS
        ========================= */
        @keyframes pageFadeIn { to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 600px) {
            header { padding: 14px 20px; }
            .container { padding: 20px 16px 40px; }
            .page-header { padding: 24px; }
            .page-header h1 { font-size: 22px; }
            .search-box { padding: 16px; }
            .announcement-card { padding: 20px; }
            .card-title { font-size: 17px; }
        }
    </style>
</head>

<body>

    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Header -->
    <header>
        <button class="back-button" id="backButton">
            ← Kembali
        </button>
        <div class="brand">
            📚 Portal Pembelajaran
        </div>
    </header>

    <!-- Main -->
    <main class="container">
        <section class="page-header">
            <h1>📢 Semua Informasi</h1>
            <p>Lihat tugas, informasi, pengumuman, dan batas pengumpulan yang diberikan oleh administrator.</p>
        </section>

        <!-- Search & Filter -->
        <section class="search-box">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari judul, pesan, atau mata pelajaran...">
            </div>
            <div class="filter">
                <button class="filter-button active" data-filter="semua">Semua</button>
                <button class="filter-button" data-filter="informasi">ℹ️ Informasi</button>
                <button class="filter-button" data-filter="tugas">📚 Tugas</button>
                <button class="filter-button" data-filter="pengumuman">📢 Pengumuman</button>
            </div>
        </section>

        <!-- Result Info -->
        <div id="resultInfo" class="result-info">
            Memuat informasi...
        </div>

        <!-- List -->
        <section id="announcementList" class="announcement-list">
            <div class="loading">
                <div class="loading-spinner"></div>
                Memuat semua informasi...
            </div>
        </section>
    </main>

    <!-- Locked Account Modal -->
    <div id="lockedMessage" class="locked-message">
        <div class="locked-box">
            <div class="locked-icon">🔒</div>
            <h2>Akun Dikunci</h2>
            <p>Akun kamu telah dikunci oleh administrator.<br><br>Kamu akan dikeluarkan dari Portal Pembelajaran.</p>
            <button id="lockedButton">Kembali ke Login</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        /* =====================================================
           SUPABASE & VARIABLES
        ===================================================== */
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { storage: window.sessionStorage } });
        
        let currentUserId = null;
        let accountLocked = false;
        let allAnnouncements = [];
        let currentFilter = "semua";
        let statusChannel = null;

        /* =====================================================
           ELEMENTS
        ===================================================== */
        const announcementList = document.getElementById("announcementList");
        const resultInfo = document.getElementById("resultInfo");
        const searchInput = document.getElementById("searchInput");

        /* =====================================================
           HELPERS
        ===================================================== */
        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function formatDate(dateValue) {
            if (!dateValue) return "";
            const date = new Date(dateValue);
            if (isNaN(date.getTime())) return "";
            return date.toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }

        function formatDeadline(deadline) {
            if (!deadline) return "";
            const date = new Date(deadline + "T00:00:00");
            if (isNaN(date.getTime())) return "";
            return date.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
        }

        /* =====================================================
           AUTH & LOCK STATUS
        ===================================================== */
        async function forceLogout() {
            if (accountLocked) return;
            accountLocked = true;
            
            if (statusChannel) {
                await supabaseClient.removeChannel(statusChannel);
                statusChannel = null;
            }
            
            document.getElementById("lockedMessage").classList.add("show");
            await SingleSession.release(supabaseClient);
            try { await supabaseClient.auth.signOut({ scope: "local" }); } catch (error) { console.error("Logout error:", error); }
        }

        async function checkLogin() {
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
            if (sessionError || !session) {
                window.location.href = "login-member.html";
                return false;
            }
            
            currentUserId = session.user.id;
            const { data: profile, error } = await supabaseClient.from("profiles").select("id, role, status").eq("id", currentUserId).single();
            
            if (error || !profile || profile.role !== "member") {
                await supabaseClient.auth.signOut({ scope: "local" });
                window.location.href = "login-member.html";
                return false;
            }
            
            if (profile.status !== "open") {
                await supabaseClient.auth.signOut({ scope: "local" });
                window.location.href = "login-member.html";
                return false;
            }
            return true;
        }

        async function checkAccountStatus() {
            if (!currentUserId || accountLocked) return;
            const { data: profile, error } = await supabaseClient.from("profiles").select("id, role, status").eq("id", currentUserId).single();
            
            if (error || !profile || profile.role !== "member" || profile.status !== "open") {
                await forceLogout();
            }
        }

        function subscribeAccountStatus() {
            if (!currentUserId) return;
            statusChannel = supabaseClient.channel("member-info-status-" + currentUserId)
                .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: "id=eq." + currentUserId },
                async function(payload) {
                    if (payload.new.role !== "member" || payload.new.status !== "open") {
                        await forceLogout();
                    }
                })
                .subscribe();
        }

        /* =====================================================
           LOAD DATA
        ===================================================== */
        async function loadAnnouncements() {
            if (accountLocked) return;
            
            announcementList.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Memuat semua informasi...</div>`;
            
            try {
                let result = await supabaseClient.from("announcements")
                    .select("id, title, message, type, subject, deadline, created_at, pinned")
                    .eq("active", true)
                    .order("pinned", { ascending: false })
                    .order("created_at", { ascending: false });

                // Fallback if pinned column doesn't exist
                if (result.error) {
                    result = await supabaseClient.from("announcements")
                        .select("id, title, message, type, subject, deadline, created_at")
                        .eq("active", true)
                        .order("created_at", { ascending: false });
                }

                if (result.error) throw result.error;

                allAnnouncements = result.data || [];
                renderAnnouncements();
            } catch (error) {
                announcementList.innerHTML = `<div class="error">❌ Gagal memuat informasi.<br><br>${escapeHTML(error.message || "Terjadi kesalahan.")}</div>`;
                resultInfo.textContent = "";
            }
        }

        /* =====================================================
           RENDER
        ===================================================== */
        function renderAnnouncements() {
            const keyword = searchInput.value.trim().toLowerCase();
            
            let filtered = allAnnouncements.filter(item => {
                if (currentFilter !== "semua" && item.type !== currentFilter) return false;
                if (!keyword) return true;
                
                const text = `${item.title || ""} ${item.message || ""} ${item.subject || ""}`.toLowerCase();
                return text.includes(keyword);
            });

            resultInfo.textContent = `${filtered.length} informasi ditampilkan`;

            if (filtered.length === 0) {
                announcementList.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>Tidak ada informasi yang ditemukan.</div>`;
                return;
            }

            announcementList.innerHTML = "";

            filtered.forEach((item, index) => {
                let badgeClass = "badge-info";
                let badgeText = "ℹ️ INFORMASI";

                if (item.type === "tugas") { badgeClass = "badge-tugas"; badgeText = "📚 TUGAS"; } 
                else if (item.type === "pengumuman") { badgeClass = "badge-pengumuman"; badgeText = "📢 PENGUMUMAN"; }

                const isPinned = item.pinned === true;
                const card = document.createElement("article");
                card.className = "announcement-card" + (isPinned ? " pinned" : "");
                card.style.animationDelay = Math.min(index * 0.05, 0.4) + "s";

                let meta = "";
                if (item.subject) meta += `<strong>📚 Mata Pelajaran:</strong> ${escapeHTML(item.subject)}<br>`;
                if (item.deadline) meta += `<strong>📅 Batas pengumpulan:</strong> ${escapeHTML(formatDeadline(item.deadline))}<br>`;
                if (item.created_at) meta += `<strong>🕒 Dipublikasikan:</strong> ${escapeHTML(formatDate(item.created_at))}`;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-badges">
                            ${isPinned ? `<span class="badge badge-pinned">📌 DISEMATKAN</span>` : ""}
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                    </div>
                    <div class="card-title">${escapeHTML(item.title)}</div>
                    <div class="card-message">${escapeHTML(item.message)}</div>
                    ${meta ? `<div class="card-meta">${meta}</div>` : ""}
                `;
                
                announcementList.appendChild(card);
            });
        }

        /* =====================================================
           EVENTS
        ===================================================== */
        searchInput.addEventListener("input", renderAnnouncements);

        document.querySelectorAll(".filter-button").forEach(button => {
            button.addEventListener("click", function() {
                document.querySelectorAll(".filter-button").forEach(btn => btn.classList.remove("active"));
                this.classList.add("active");
                currentFilter = this.dataset.filter;
                renderAnnouncements();
            });
        });

        document.getElementById("backButton").addEventListener("click", async function() {
            if (accountLocked) return;
            if (statusChannel) {
                await supabaseClient.removeChannel(statusChannel);
                statusChannel = null;
            }
            window.location.href = "member.html";
        });

        document.getElementById("lockedButton").addEventListener("click", async function() {
            try { await supabaseClient.auth.signOut({ scope: "local" }); } catch (e) {}
            window.location.href = "login-member.html";
        });

        supabaseClient.auth.onAuthStateChange(function(event) {
            if (event === "SIGNED_OUT" && !accountLocked) {
                window.location.href = "login-member.html";
            }
        });

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible") checkAccountStatus();
        });

        /* =====================================================
           INIT
        ===================================================== */
        async function start() {
            const loggedIn = await checkLogin();
            if (!loggedIn) return;
            if (!(await SingleSession.guard(supabaseClient))) return;
            subscribeAccountStatus();
            await loadAnnouncements();
        }

        start();
    </script>
</body>
</html>
