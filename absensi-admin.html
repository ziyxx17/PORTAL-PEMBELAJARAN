<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Absensi - Portal Pembelajaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;background:#0f172a;color:#f8fafc;overflow-x:hidden;opacity:0;animation:fi .6s forwards}
@keyframes fi{to{opacity:1}}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.35}
.o1{width:480px;height:480px;background:#8b5cf6;top:-150px;right:-100px}
.o2{width:430px;height:430px;background:#3b82f6;bottom:-150px;left:-100px}
header{background:rgba(15,23,42,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.1);padding:16px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
header strong{font-size:18px;font-weight:700}
.back{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#f8fafc;padding:10px 18px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit}
.back:hover{background:rgba(255,255,255,.15)}
.container{max-width:1000px;margin:auto;padding:28px 20px 40px;position:relative;z-index:1}
h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:18px;font-weight:700;margin:0 0 14px}
.sub{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:22px}
.card{background:rgba(30,41,59,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;margin-bottom:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:150px}
label{display:block;font-size:12.5px;font-weight:700;color:#cbd5e1;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.12);border-radius:12px;outline:none;font-size:14px;font-family:inherit;color:#f8fafc}
input:focus,select:focus,textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.15)}
select option{background:#1e293b;color:#f8fafc}
textarea{min-height:84px;resize:vertical}
.btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#f8fafc;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13.5px;font-family:inherit;transition:.2s}
.btn:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent}
.btn.ok{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent}
.btn.dan{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.btn.dan:hover{background:#ef4444;color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b-hadir{background:rgba(16,185,129,.15);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
.b-izin{background:rgba(59,130,246,.15);color:#93c5fd;border-color:rgba(59,130,246,.3)}
.b-sakit{background:rgba(245,158,11,.15);color:#fde047;border-color:rgba(245,158,11,.3)}
.b-alfa{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.b-dispen{background:rgba(168,85,247,.15);color:#d8b4fe;border-color:rgba(168,85,247,.3)}
.b-none{background:rgba(148,163,184,.12);color:#94a3b8;border-color:rgba(148,163,184,.25)}
.b-open{background:rgba(16,185,129,.15);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
.b-closed{background:rgba(148,163,184,.14);color:#cbd5e1;border-color:rgba(148,163,184,.3)}
.msg{display:none;padding:13px 16px;border-radius:14px;margin-bottom:18px;font-size:14px;font-weight:600;line-height:1.5}
.msg.e{display:block;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.msg.s{display:block;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
.stat{background:rgba(30,41,59,.6);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;text-align:center}
.stat .n{font-size:26px;font-weight:800}.stat .l{color:#94a3b8;font-size:12px;margin-top:2px;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:rgba(15,23,42,.45);border:1px solid rgba(255,255,255,.07);margin-bottom:10px}
.item b{display:block;font-size:14.5px}.item span.d{color:#94a3b8;font-size:12.5px}
.empty{text-align:center;color:#94a3b8;padding:26px;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:9500;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.box{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:rgba(30,41,59,.95);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:24px}
.box h2{text-align:center}.box .f{margin-bottom:14px}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:1/1;object-fit:cover}
/* ===== Tombol aksi sesi ===== */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.act{--tint:rgba(255,255,255,.1);--bd:rgba(255,255,255,.2);--glow:rgba(148,163,184,.5);position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;text-align:left;padding:13px 15px;border-radius:18px;cursor:pointer;font-family:inherit;color:#f8fafc;
border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,border-color .25s,background .25s}
.act::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%)}
.act .ico{position:relative;flex:0 0 44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--tint);border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.act .tx{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.act .tx b{font-size:14px;font-weight:800;line-height:1.25;display:block;letter-spacing:-.01em}
.act .tx small{font-size:11.5px;color:#94a3b8;font-weight:600;line-height:1.35}
.act:hover{transform:translateY(-3px);border-color:var(--bd);box-shadow:0 14px 28px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.act:active{transform:translateY(0) scale(.98)}
.act:focus-visible{outline:2px solid #8b5cf6;outline-offset:2px}
.act:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.a-pause{--tint:rgba(245,158,11,.2);--bd:rgba(245,158,11,.45);--glow:rgba(245,158,11,.65)}
.a-open{--tint:rgba(59,130,246,.22);--bd:rgba(59,130,246,.5);--glow:rgba(59,130,246,.7);background:linear-gradient(135deg,rgba(59,130,246,.24),rgba(37,99,235,.08))}
.a-final{--tint:rgba(16,185,129,.24);--bd:rgba(16,185,129,.55);--glow:rgba(16,185,129,.7);background:linear-gradient(135deg,rgba(16,185,129,.3),rgba(5,150,105,.1));border-color:rgba(16,185,129,.35)}
.a-final .tx small{color:#a7f3d0}
.a-csv{--tint:rgba(56,189,248,.2);--bd:rgba(56,189,248,.45);--glow:rgba(56,189,248,.6)}
.a-del{--tint:rgba(239,68,68,.2);--bd:rgba(239,68,68,.5);--glow:rgba(239,68,68,.65);background:linear-gradient(135deg,rgba(239,68,68,.14),rgba(239,68,68,.04));border-color:rgba(239,68,68,.28)}
.a-del .tx b{color:#fca5a5}.a-del .tx small{color:#f8a4a4;opacity:.85}
.a-del:hover{background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(239,68,68,.1))}
/* ===== Sheet pilih status ===== */
.mini{padding:9px 14px;font-size:13px;border-radius:12px}
.sheet{display:none;position:fixed;inset:0;z-index:9500;background:rgba(2,6,23,.65);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);align-items:flex-end;justify-content:center}
.sheet.show{display:flex;animation:shBg .2s both}
@keyframes shBg{from{opacity:0}to{opacity:1}}
.sh-box{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;
background:linear-gradient(180deg,rgba(51,65,85,.97),rgba(30,41,59,.98));border:1px solid rgba(255,255,255,.14);border-bottom:0;
box-shadow:0 -20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);animation:shUp .35s cubic-bezier(.34,1.3,.64,1) both}
@keyframes shUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){.sheet{align-items:center}.sh-box{border-radius:28px;border-bottom:1px solid rgba(255,255,255,.14)}}
.sh-grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sh-head{display:flex;gap:13px;align-items:center;margin-bottom:18px}
.sh-av{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sh-head h3{font-size:17px;font-weight:800;line-height:1.2;word-break:break-word}
.sh-head p{font-size:12.5px;color:#94a3b8;font-weight:600;margin-top:2px}
.sh-lbl{display:block;font-size:12.5px;font-weight:700;color:#cbd5e1;margin:0 0 8px}
.sh-lbl span{color:#64748b;font-weight:600}
.sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.sh-opt{--c:148,163,184;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 6px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:#e2e8f0;
background:rgba(15,23,42,.5);border:1px solid rgba(255,255,255,.1);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,box-shadow .2s}
.sh-opt .e{font-size:23px;line-height:1.1}
.sh-opt:hover{border-color:rgba(var(--c),.6);transform:translateY(-2px)}
.sh-opt:active{transform:scale(.96)}
.sh-opt.on{color:#fff;background:rgba(var(--c),.22);border-color:rgba(var(--c),.85);box-shadow:0 0 0 3px rgba(var(--c),.18),inset 0 1px 0 rgba(255,255,255,.25)}
.sh-opt[data-v="hadir"]{--c:16,185,129}.sh-opt[data-v="izin"]{--c:59,130,246}.sh-opt[data-v="sakit"]{--c:245,158,11}.sh-opt[data-v="alfa"]{--c:239,68,68}.sh-opt[data-v="dispen"]{--c:168,85,247}
#shNote{min-height:76px;font-size:16px;line-height:1.5}
.sh-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sh-chip{padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:#cbd5e1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);transition:.2s}
.sh-chip:hover{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.6);color:#fff}
.sh-count{text-align:right;font-size:11.5px;color:#64748b;margin-top:6px;font-weight:600}
.sh-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:16px}
.sh-actions .btn{padding:14px;font-size:14.5px;border-radius:14px}
/* ===== Pilihan interval kode ===== */
.ivbox{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.09);text-align:left}
.ivgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.iv{padding:11px 4px;border-radius:13px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;color:#cbd5e1;text-align:center;line-height:1.2;
background:rgba(15,23,42,.5);border:1px solid rgba(255,255,255,.1);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,box-shadow .2s}
.iv:hover{border-color:rgba(139,92,246,.6);transform:translateY(-2px)}
.iv:active{transform:scale(.96)}
.iv.on{color:#fff;background:rgba(139,92,246,.28);border-color:rgba(139,92,246,.9);box-shadow:0 0 0 3px rgba(139,92,246,.18),inset 0 1px 0 rgba(255,255,255,.25)}
.iv:disabled{opacity:.5;cursor:wait;transform:none}
.ivnote{font-size:12.5px;color:#94a3b8;line-height:1.55;margin:12px 2px 14px}
.a-reset{--tint:rgba(139,92,246,.24);--bd:rgba(139,92,246,.55);--glow:rgba(139,92,246,.7);width:100%;justify-content:center}
.a-reset .tx{align-items:flex-start}
@media(max-width:600px){header{padding:14px 16px}.container{padding:20px 14px 30px}}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>
<header><button class="back" onclick="go('admin.html')">← Kembali</button><strong>✅ Kelola Absensi</strong></header>
<main class="container">
  <h1>Kelola Absensi</h1>
  <p class="sub">Buat sesi, tampilkan QR agar member scan, atau isi absensi secara manual.</p>
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>➕ Sesi Absensi Baru</h2>
    <div class="row">
      <div style="flex:2"><label for="nTitle">Judul sesi</label><input id="nTitle" maxlength="80" placeholder="Contoh: Matematika - Kelas 10A"></div>
      <div><label for="nStart">Mulai</label><input id="nStart" type="datetime-local"></div>
      <div><label for="nDur">Durasi</label><select id="nDur"><option value="30">30 menit</option><option value="60" selected>1 jam</option><option value="90">1,5 jam</option><option value="120">2 jam</option><option value="180">3 jam</option><option value="480">Seharian (8 jam)</option></select></div>
      <button class="btn pri" id="btnCreate" style="flex:0 0 auto">Buat &amp; Buka</button>
    </div>
  </div>

  <div class="card"><h2>🗂️ Sesi Terbaru</h2><div id="list"><div class="empty">⏳ Memuat...</div></div></div>

  <div id="detail" style="display:none">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
        <div><h2 id="dTitle" style="margin:0"></h2><span class="sub" id="dWhen" style="margin:0"></span></div>
        <div id="dStatus"></div>
      </div>
      <div class="actions">
        <button class="act a-pause" id="btnToggle" type="button"></button>
        <button class="act a-final" id="btnFinal" type="button"><span class="ico">🏁</span><span class="tx"><b>Tutup &amp; tandai Alfa</b><small>Yang belum absen otomatis jadi Alfa</small></span></button>
        <button class="act a-csv" id="btnCsv" type="button"><span class="ico">⬇️</span><span class="tx"><b>Unduh CSV</b><small>Simpan rekap absensi sesi ini</small></span></button>
        <button class="act a-del" id="btnDel" type="button"><span class="ico">🗑️</span><span class="tx"><b>Hapus sesi</b><small>Hapus permanen beserta catatannya</small></span></button>
      </div>
    </div>

    <div class="card" id="qrCard" style="text-align:center">
      <h2>📲 QR Absensi</h2>
      <div style="display:inline-block;background:#fff;padding:12px;border-radius:18px"><canvas id="qr"></canvas></div>
      <p style="margin-top:12px;font-size:13px;color:#94a3b8">Kode manual:</p>
      <p id="qrCode" style="font-size:26px;font-weight:800;letter-spacing:.12em"></p>
      <p id="qrCd" style="font-size:12.5px;color:#94a3b8;margin-top:4px"></p>
      <div class="ivbox">
        <span class="sh-lbl">⏱️ Ganti kode otomatis setiap</span>
        <div class="ivgrid" id="ivGrid"></div>
        <p class="ivnote" id="ivNote"></p>
        <button class="act a-reset" id="btnReset" type="button"><span class="ico">🔄</span><span class="tx"><b>Reset kode sekarang</b><small>Kode lama langsung tidak berlaku</small></span></button>
      </div>
    </div>

    <div class="stats" id="sum"></div>
    <div class="card"><h2>👥 Daftar Member</h2><div id="mem"></div></div>
  </div>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sh-box" role="dialog" aria-modal="true" aria-labelledby="shName">
    <div class="sh-grab"></div>
    <div class="sh-head"><div class="sh-av" id="shAv">?</div><div><h3 id="shName"></h3><p id="shUser"></p></div></div>
    <span class="sh-lbl">Pilih status absensi</span>
    <div class="sh-grid" id="shGrid"></div>
    <div id="shNoteWrap" style="display:none">
      <label class="sh-lbl" for="shNote">Keterangan <span>(boleh dikosongkan)</span></label>
      <textarea id="shNote" maxlength="120" placeholder="Tulis keterangan singkat..."></textarea>
      <div class="sh-chips" id="shChips"></div>
      <div class="sh-count" id="shCount">0/120</div>
    </div>
    <div class="sh-actions"><button class="btn" id="shCancel" type="button">Batal</button><button class="btn pri" id="shSave" type="button">Simpan</button></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js';document.head.appendChild(s)"></script>
<script>

const $=id=>document.getElementById(id);
function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function msg(t,ok){const m=$("msg");m.className="msg "+(ok?"s":"e");m.textContent=t;m.scrollIntoView({behavior:"smooth",block:"nearest"})}
function go(u){document.body.style.transition="opacity .2s";document.body.style.opacity=0;setTimeout(()=>location.href=u,200)}
function fmt(iso){const d=new Date(iso);return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})+", "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function jam(iso){return new Date(iso).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
const ST={hadir:["✅ Hadir","b-hadir"],izin:["📝 Izin","b-izin"],sakit:["🤒 Sakit","b-sakit"],alfa:["❌ Alfa","b-alfa"],dispen:["🎖️ Dispen","b-dispen"]};
const METODE={qr:"Scan QR",manual:"Diisi guru/admin",izin_member:"Diajukan sendiri",otomatis:"Otomatis (tidak hadir)"};
const badge=s=>s&&ST[s]?'<span class="badge '+ST[s][1]+'">'+ST[s][0]+'</span>':'<span class="badge b-none">Belum absen</span>';
window.addEventListener("pageshow",()=>{document.body.style.opacity=1});

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.sessionStorage}});
let sessions=[],cur=null,members=[],recs=new Map(),nextRotate=0,tickN=0,rotating=false,curCode="",curInterval=300,qrErr="";

async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session){go("index.html");return}
  const {data:p}=await sb.from("profiles").select("role,status").eq("id",data.session.user.id).maybeSingle();
  const role=String(p&&p.role||"").toLowerCase();
  if(!p||String(p.status).toLowerCase()!=="open"||!(await Perm.allow(sb,role,"kelola_absensi"))){alert("Kamu tidak punya izin mengelola absensi.");go("admin.html");return}
  $("nStart").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  await loadSessions();
  setInterval(tick,1000);
}

async function loadSessions(){
  const {data,error}=await sb.from("attendance_sessions").select("id,title,starts_at,ends_at,status").order("starts_at",{ascending:false}).limit(30);
  if(error){$("list").innerHTML='<div class="empty">❌ '+esc(error.message)+'<br><br>Pastikan 05-absensi.sql sudah dijalankan.</div>';return}
  sessions=data||[];
  $("list").innerHTML=sessions.length?sessions.map(s=>'<div class="item"><div><b>'+esc(s.title)+'</b><span class="d">'+fmt(s.starts_at)+' – '+jam(s.ends_at)+'</span></div><div style="display:flex;gap:8px;align-items:center"><span class="badge '+(s.status==="open"?"b-open":"b-closed")+'">'+(s.status==="open"?"🟢 Terbuka":"⚪ Ditutup")+'</span><button class="btn'+(cur&&cur.id===s.id?" pri":"")+'" data-open="'+s.id+'">Buka</button></div></div>').join(""):'<div class="empty">Belum ada sesi. Buat sesi baru di atas.</div>';
}

async function openSession(id){
  cur=sessions.find(s=>s.id===id);if(!cur)return;
  if(!members.length){
    const {data}=await sb.from("profiles").select("id,nama,username").eq("role","member").order("nama",{ascending:true});
    members=data||[];
  }
  await loadRecs();
  $("detail").style.display="";
  curCode="";qrErr="";nextRotate=0;
  renderDetail();loadSessions();
  if(cur.status==="open")await initCode();
  $("detail").scrollIntoView({behavior:"smooth",block:"start"});
}

async function loadRecs(){
  const {data,error}=await sb.from("attendance_records").select("user_id,status,method,note,marked_at").eq("session_id",cur.id);
  if(error){msg("Gagal memuat absensi: "+error.message,false);return}
  recs=new Map((data||[]).map(r=>[r.user_id,r]));
}

function setToggle(open){
  const b=$("btnToggle");
  b.className="act "+(open?"a-pause":"a-open");
  b.innerHTML=open
    ?'<span class="ico">⏸️</span><span class="tx"><b>Tutup sesi</b><small>Tanpa menandai Alfa</small></span>'
    :'<span class="ico">▶️</span><span class="tx"><b>Buka lagi sesi</b><small>Member bisa scan QR kembali</small></span>';
}

function renderDetail(){
  const open=cur.status==="open";
  $("dTitle").textContent=cur.title;$("dWhen").textContent=fmt(cur.starts_at)+" – "+jam(cur.ends_at);
  $("dStatus").innerHTML='<span class="badge '+(open?"b-open":"b-closed")+'">'+(open?"🟢 Terbuka":"⚪ Ditutup")+'</span>';
  setToggle(open);
  $("qrCard").style.display=open?"":"none";
  const c={hadir:0,izin:0,sakit:0,alfa:0,dispen:0};let belum=0;
  members.forEach(m=>{const r=recs.get(m.id);if(r&&c[r.status]!=null)c[r.status]++;else belum++});
  $("sum").innerHTML=Object.keys(c).map(k=>'<div class="stat"><div class="n">'+c[k]+'</div><div class="l">'+ST[k][0]+'</div></div>').join("")+'<div class="stat"><div class="n">'+belum+'</div><div class="l">Belum absen</div></div>';
  $("mem").innerHTML=members.length?members.map(m=>{
    const r=recs.get(m.id),s=r&&r.status;
    return '<div class="item"><div><b>'+esc(m.nama||"Tanpa nama")+'</b><span class="d">@'+esc(m.username||"-")+(r?' · '+esc(METODE[r.method]||r.method)+(r.note?' · "'+esc(r.note)+'"':''):'')+'</span></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+badge(s)+'<button class="btn mini" type="button" data-pick="'+m.id+'">✏️ Ubah</button></div></div>';
  }).join(""):'<div class="empty">Belum ada member.</div>';
}

const IV=[[30,"30 dtk","30 detik"],[60,"1 mnt","1 menit"],[300,"5 mnt","5 menit"],[600,"10 mnt","10 menit"],[1800,"30 mnt","30 menit"],[3600,"1 jam","1 jam"],[0,"Manual","Manual"],[-1,"Tetap","Tidak pernah ganti"]];
function fmtDur(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),d=s%60,p=n=>String(n).padStart(2,"0");return h?h+":"+p(m)+":"+p(d):m+":"+p(d)}
function ivNote(){
  const iv=IV.find(x=>x[0]===curInterval);const nm=iv?iv[2]:"";
  if(curInterval>0)return "Kode berganti otomatis setiap "+nm+". Kalau halaman ini ditutup, kode lama otomatis kedaluwarsa sekitar 45 detik setelah jadwal ganti berikutnya. Untuk interval panjang, kode yang sama bisa dipakai siswa sepanjang waktu itu.";
  if(curInterval===0)return "Mode manual: kode tetap sama sampai kamu menekan Reset. Berlaku sampai sesi ditutup atau waktu sesi habis. Siswa tidak perlu scan ulang kalau kode belum direset.";
  return "Kode tidak pernah berganti selama sesi dibuka (sampai sesi ditutup atau waktu sesi habis). Paling praktis, tapi QR/kode bisa dibagikan ke siapa saja, termasuk yang tidak hadir. Kamu tetap bisa menekan Reset kapan saja.";
}
function renderIv(){
  $("ivGrid").innerHTML=IV.map(o=>'<button type="button" class="iv'+(o[0]===curInterval?" on":"")+'" data-v="'+o[0]+'">'+o[1]+'</button>').join("");
  $("ivNote").textContent=ivNote();
}
function cdText(){
  if(curInterval>0)return "Berganti dalam "+fmtDur(Math.max(0,Math.ceil((nextRotate-Date.now())/1000)));
  return curInterval===0?"Kode tetap • ganti lewat tombol Reset":"Kode tetap sampai sesi ditutup";
}
async function drawQR(code){
  if(typeof QRCode==="undefined"){qrErr="Library QR tidak termuat, pakai kode manual";return}
  try{await QRCode.toCanvas($("qr"),code,{width:240,margin:1,color:{dark:"#0f172a",light:"#ffffff"}})}
  catch(e){qrErr="Gagal membuat QR: "+(e.message||e)}
}
function applyCode(code,at){
  curCode=code;qrErr="";$("qrCode").textContent=code;
  nextRotate=curInterval>0?at+curInterval*1000:Infinity;
  renderIv();return drawQR(code);
}
async function fetchCode(){
  const {data,error}=await sb.rpc("get_attendance_code",{p_session:cur.id});
  return error?null:data;
}
async function initCode(){
  const g=await fetchCode();
  if(g&&g.code&&g.interval!=null){
    curInterval=g.interval;renderIv();
    const age=Number(g.age)||0;
    if(!(g.interval>0&&age>=g.interval)){await applyCode(g.code,Date.now()-age*1000);return}
  }else{curInterval=300;renderIv()}
  await rotateQR();
}
async function syncCode(){
  if(!cur||cur.status!=="open"||rotating)return;
  const g=await fetchCode();
  if(!g||!g.code||g.interval==null)return;
  if(g.code!==curCode||g.interval!==curInterval){curInterval=g.interval;await applyCode(g.code,Date.now()-(Number(g.age)||0)*1000)}
}
async function rotateQR(force){
  if(!cur||cur.status!=="open")return;
  if(rotating){if(!force)return;while(rotating)await new Promise(r=>setTimeout(r,120))}
  rotating=true;
  try{
    const {data,error}=await sb.rpc("rotate_attendance_code",{p_session:cur.id,p_interval:curInterval});
    if(error)throw error;
    await applyCode(data,Date.now());
  }catch(e){
    const m=String(e.message||e);
    qrErr="Gagal membuat kode: "+(/p_interval|Could not find|schema cache/i.test(m)?"jalankan skrip 06-interval-kode.sql di Supabase dulu.":m);
    if(!curCode||curInterval>0)nextRotate=Date.now()+10000;
  }
  rotating=false;
}
function tick(){
  if(!cur||document.visibilityState!=="visible")return;
  tickN++;
  if(cur.status==="open"){
    if(Date.now()>=nextRotate)rotateQR();
    else $("qrCd").textContent=qrErr||cdText();
    if(qrErr)$("qrCd").textContent=qrErr;
    if(tickN%8===0&&!$("sheet").classList.contains("show")){loadRecs().then(renderDetail);syncCode()}
  }
}
$("ivGrid").addEventListener("click",async e=>{
  const b=e.target.closest(".iv");if(!b||!cur||cur.status!=="open")return;
  const v=Number(b.dataset.v);if(v===curInterval)return;
  curInterval=v;renderIv();
  document.querySelectorAll(".iv").forEach(x=>x.disabled=true);
  await rotateQR(true);
  document.querySelectorAll(".iv").forEach(x=>x.disabled=false);
});
$("btnReset").onclick=async()=>{
  const btn=$("btnReset"),t=btn.querySelector("b");btn.disabled=true;t.textContent="Mereset...";
  await rotateQR(true);
  t.textContent=qrErr?"Gagal, coba lagi":"✅ Kode direset";
  setTimeout(()=>{t.textContent="Reset kode sekarang";btn.disabled=false},1400);
};

const SH_OPTS=[["hadir","✅","Hadir"],["izin","📝","Izin"],["sakit","🤒","Sakit"],["alfa","❌","Alfa"],["dispen","🎖️","Dispen"],["","⏺️","Belum"]];
const SH_QUICK={izin:["Acara keluarga","Keperluan keluarga","Urusan mendesak"],sakit:["Demam","Sakit kepala","Sakit perut","Ada surat dokter"],dispen:["Mewakili sekolah","Lomba","Kegiatan sekolah"]};
let shUid=null,shVal="";
const shNeedsNote=v=>v==="izin"||v==="sakit"||v==="dispen";
function shCount(){$("shCount").textContent=$("shNote").value.length+"/120"}
function shRender(){
  $("shGrid").innerHTML=SH_OPTS.map(o=>'<button type="button" class="sh-opt'+(o[0]===shVal?" on":"")+'" data-v="'+o[0]+'"><span class="e">'+o[1]+'</span>'+o[2]+'</button>').join("");
  const need=shNeedsNote(shVal);
  $("shNoteWrap").style.display=need?"":"none";
  $("shChips").innerHTML=need?(SH_QUICK[shVal]||[]).map(t=>'<button type="button" class="sh-chip" data-t="'+esc(t)+'">'+esc(t)+'</button>').join(""):"";
}
function openSheet(uid){
  const m=members.find(x=>x.id===uid);if(!m)return;
  const r=recs.get(uid);
  shUid=uid;shVal=r&&r.status?r.status:"";
  $("shAv").textContent=(m.nama||m.username||"?").charAt(0).toUpperCase();
  $("shName").textContent=m.nama||"Tanpa nama";$("shUser").textContent="@"+(m.username||"-");
  $("shNote").value=(r&&r.note)||"";shCount();shRender();
  $("sheet").classList.add("show");$("sheet").setAttribute("aria-hidden","false");
}
function closeSheet(){$("sheet").classList.remove("show");$("sheet").setAttribute("aria-hidden","true");shUid=null}
$("shGrid").addEventListener("click",e=>{const b=e.target.closest(".sh-opt");if(!b)return;shVal=b.dataset.v;shRender()});
$("shChips").addEventListener("click",e=>{const b=e.target.closest(".sh-chip");if(!b)return;$("shNote").value=b.dataset.t;shCount()});
$("shNote").addEventListener("input",shCount);
$("shCancel").onclick=closeSheet;
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("show"))closeSheet()});
$("shSave").onclick=async()=>{
  if(!shUid||!cur)return;
  const uid=shUid,val=shVal,note=shNeedsNote(val)?($("shNote").value.trim()||null):null;
  const btn=$("shSave");btn.disabled=true;btn.textContent="Menyimpan...";
  const {error}=await sb.rpc("mark_attendance",{p_session:cur.id,p_user:uid,p_status:val,p_note:note});
  btn.disabled=false;btn.textContent="Simpan";closeSheet();
  if(error){msg("Gagal menyimpan: "+error.message,false);return}
  await loadRecs();renderDetail();
};
$("mem").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b)openSheet(b.dataset.pick)});

$("btnCreate").onclick=async()=>{
  const t=$("nTitle").value.trim();if(t.length<2){msg("Judul sesi wajib diisi.",false);return}
  const st=$("nStart").value?new Date($("nStart").value).toISOString():new Date().toISOString();
  $("btnCreate").disabled=true;
  const {data,error}=await sb.rpc("create_attendance_session",{p_title:t,p_starts:st,p_minutes:Number($("nDur").value)});
  $("btnCreate").disabled=false;
  if(error){msg("Gagal membuat sesi: "+error.message,false);return}
  $("nTitle").value="";msg("Sesi dibuat. Tampilkan QR ke member.",true);
  await loadSessions();await openSession(data);
};
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b)openSession(b.dataset.open)});
$("btnToggle").onclick=async()=>{
  const to=cur.status==="open"?"closed":"open";
  if(to==="closed"&&!confirm("Tutup sesi ini? Member tidak bisa scan lagi."))return;
  const {error}=await sb.rpc("set_attendance_session_status",{p_session:cur.id,p_status:to});
  if(error){msg("Gagal: "+error.message,false);return}
  await loadSessions();await openSession(cur.id);
};
$("btnFinal").onclick=async()=>{
  if(!confirm("Tutup sesi dan tandai ALFA untuk semua member yang belum absen?"))return;
  const {data,error}=await sb.rpc("finalize_attendance",{p_session:cur.id});
  if(error){msg("Gagal: "+error.message,false);return}
  msg(data+" member ditandai Alfa. Sesi ditutup.",true);
  await loadSessions();await openSession(cur.id);
};
$("btnDel").onclick=async()=>{
  if(!confirm("Hapus sesi ini beserta seluruh catatan absensinya? Tidak bisa dibatalkan."))return;
  const {error}=await sb.rpc("delete_attendance_session",{p_session:cur.id});
  if(error){msg("Gagal: "+error.message,false);return}
  cur=null;$("detail").style.display="none";msg("Sesi dihapus.",true);loadSessions();
};
$("btnCsv").onclick=()=>{
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const L=[["Nama","Username","Status","Metode","Keterangan","Waktu"].map(q).join(",")];
  members.forEach(m=>{const r=recs.get(m.id);L.push([m.nama,m.username,r?r.status:"belum",r?(METODE[r.method]||r.method):"",r?r.note:"",r?new Date(r.marked_at).toLocaleString("id-ID"):""].map(q).join(","))});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download="absensi-"+cur.title.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".csv";document.body.appendChild(a);a.click();a.remove();
};
init();
</script>
</body>
</html>
