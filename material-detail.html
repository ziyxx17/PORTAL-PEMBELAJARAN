<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Materi - Portal Pembelajaran</title>

<!-- GOOGLE FONTS (PLUS JAKARTA SANS) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET & DARK BASE STYLES
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(37, 99, 235, 0.15),
            transparent 45%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(124, 58, 237, 0.15),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #070a12,
            #0f172a,
            #1e293b
        );
    color: #f8fafc;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

/* =====================================================
   KEYFRAME ANIMATIONS
===================================================== */

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =====================================================
   HEADER
===================================================== */

header {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.back {
    border: none;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f8fafc;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.back:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateX(-3px);
}

.back:active {
    transform: scale(0.96);
}

.brand {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.01em;
}

/* =====================================================
   CONTAINER
===================================================== */

.container {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 60px;
}

/* =====================================================
   LOADING STATE
===================================================== */

.loading {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 48px 24px;
    border-radius: 20px;
    text-align: center;
    color: #94a3b8;
    box-shadow: 0 8px 25px -8px rgba(0, 0, 0, 0.3);
    font-weight: 600;
}

.spinner {
    width: 36px;
    height: 36px;
    border: 3.5px solid rgba(255, 255, 255, 0.1);
    border-top-color: #3b82f6;
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
}

/* =====================================================
   CONTENT CARD
===================================================== */

.content-card {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
    animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* SUBJECT BADGE */

.subject {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #60a5fa;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
}

/* TITLE & DIVIDER */

.title {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.35;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
}

.divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 24px 0;
}

/* SECTION MATERI */

.section {
    margin-top: 24px;
}

.label {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.content {
    color: #e2e8f0;
    line-height: 1.8;
    white-space: pre-line;
    font-size: 15px;
    background: rgba(255, 255, 255, 0.03);
    padding: 20px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

/* SOAL BOX */

.question-box {
    margin-top: 24px;
    padding: 22px;
    background: rgba(249, 115, 22, 0.08);
    border: 1px solid rgba(249, 115, 22, 0.2);
    border-left: 4px solid #f97316;
    border-radius: 14px;
    animation: fadeUp 0.5s ease;
}

.question-label {
    font-weight: 700;
    color: #fb923c;
    margin-bottom: 10px;
    font-size: 15px;
}

.question {
    color: #ffedd5;
    line-height: 1.8;
    white-space: pre-line;
    font-size: 15px;
}

/* JAWABAN BOX */

.answer-box {
    margin-top: 20px;
    padding: 22px;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(34, 197, 94, 0.2);
    border-left: 4px solid #22c55e;
    border-radius: 14px;
    animation: fadeUp 0.6s ease;
}

.answer-label {
    font-weight: 700;
    color: #4ade80;
    margin-bottom: 10px;
    font-size: 15px;
}

.answer {
    color: #dcfce7;
    line-height: 1.8;
    white-space: pre-line;
    font-size: 15px;
}

/* INFO BOX */

.info-box {
    margin-top: 24px;
    padding: 16px 20px;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-left: 4px solid #3b82f6;
    border-radius: 14px;
    color: #93c5fd;
    line-height: 1.6;
    font-size: 14px;
    font-weight: 600;
}

/* ERROR STATE */

.error {
    background: rgba(239, 68, 68, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(239, 68, 68, 0.25);
    padding: 44px 24px;
    border-radius: 20px;
    text-align: center;
    color: #fca5a5;
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

.error-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.error h2 {
    font-size: 20px;
    font-weight: 700;
    color: #fca5a5;
}

.error p {
    color: #f87171;
    font-size: 14px;
    margin-top: 6px;
}

/* =====================================================
   RESPONSIVE (MOBILE)
===================================================== */

@media (max-width: 600px) {
    header {
        padding: 14px 16px;
    }

    .brand {
        font-size: 15px;
    }

    .container {
        padding: 20px 14px 40px;
    }

    .content-card {
        padding: 22px 18px;
        border-radius: 16px;
    }

    .title {
        font-size: 22px;
    }

    .content,
    .question,
    .answer {
        font-size: 14px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
    <button class="back" onclick="goBack()">
        ← Kembali
    </button>
    <div class="brand">
        📚 Portal Pembelajaran
    </div>
</header>

<!-- MAIN CONTAINER -->
<main class="container">
    <div id="detail">
        <div class="loading">
            <div class="spinner"></div>
            Memuat konten...
        </div>
    </div>
</main>

<!-- SCRIPTS -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   SUPABASE CLIENT
========================= */
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

/* =========================
   AMBIL ID URL
========================= */
const params = new URLSearchParams(window.location.search);
const materialId = params.get("id");

/* =========================
   NAVIGASI KEMBALI
========================= */
function goBack() {
    if (document.referrer) {
        history.back();
    } else {
        location.href = "member.html";
    }
}

/* =========================
   VERIFIKASI LOGIN
========================= */
async function checkLogin() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        location.href = "login-member.html";
        return false;
    }

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("id, nama, username, role, status")
        .eq("id", session.user.id)
        .single();

    if (
        error ||
        !profile ||
        profile.role !== "member" ||
        profile.status !== "open"
    ) {
        await supabaseClient.auth.signOut();
        location.href = "login-member.html";
        return false;
    }

    return true;
}

/* =========================
   LOAD CONTENT MATERI
========================= */
async function loadMaterial() {
    const detail = document.getElementById("detail");

    if (!materialId) {
        showError(
            "Konten tidak ditemukan.",
            "ID konten tidak tersedia."
        );
        return;
    }

    /* AMBIL DATA MATERIALS */
    const { data: material, error } = await supabaseClient
        .from("materials")
        .select("id, subject_id, judul, isi, soal, jawaban")
        .eq("id", materialId)
        .single();

    if (error || !material) {
        console.error("MATERIAL ERROR:", error);
        showError(
            "Gagal memuat konten.",
            error ? error.message : "Konten tidak ditemukan."
        );
        return;
    }

    /* LOAD NAMA SUBJECT */
    const { data: subject } = await supabaseClient
        .from("subjects")
        .select("nama")
        .eq("id", material.subject_id)
        .single();

    const subjectName = subject ? subject.nama : "Mata Pelajaran";

    /* CEK KETERSEDIAAN KONTEN */
    const adaMateri = typeof material.isi === "string" && material.isi.trim() !== "";
    const adaSoal = typeof material.soal === "string" && material.soal.trim() !== "";
    const adaJawaban = typeof material.jawaban === "string" && material.jawaban.trim() !== "";

    /* MATERI HTML */
    let materiHTML = "";
    if (adaMateri) {
        materiHTML = `
        <div class="section">
            <div class="label">📘 Materi</div>
            <div class="content">${escapeHTML(material.isi)}</div>
        </div>
        `;
    }

    /* SOAL HTML */
    let soalHTML = "";
    if (adaSoal) {
        soalHTML = `
        <div class="question-box">
            <div class="question-label">❓ Soal / Pertanyaan</div>
            <div class="question">${escapeHTML(material.soal)}</div>
        </div>
        `;
    }

    /* JAWABAN HTML */
    let jawabanHTML = "";
    if (adaJawaban) {
        jawabanHTML = `
        <div class="answer-box">
            <div class="answer-label">💡 Jawaban</div>
            <div class="answer">${escapeHTML(material.jawaban)}</div>
        </div>
        `;
    }

    /* INFO HTML */
    let infoHTML = "";
    if (adaMateri && !adaSoal) {
        infoHTML = `<div class="info-box">📘 Ini adalah materi pembelajaran.</div>`;
    }
    if (!adaMateri && adaSoal && adaJawaban) {
        infoHTML = `<div class="info-box">📝 Silakan pelajari soal dan perhatikan jawabannya.</div>`;
    }
    if (adaMateri && adaSoal && adaJawaban) {
        infoHTML = `<div class="info-box">📚 Materi, soal, dan jawaban tersedia pada konten ini.</div>`;
    }
    if (!adaMateri && !adaSoal && !adaJawaban) {
        infoHTML = `<div class="info-box">📭 Konten ini belum memiliki isi pembelajaran.</div>`;
    }

    /* RENDER TAMPILAN */
    detail.innerHTML = `
    <article class="content-card">
        <div class="subject">📚 ${escapeHTML(subjectName)}</div>
        <h1 class="title">${escapeHTML(material.judul)}</h1>
        <div class="divider"></div>
        ${materiHTML}
        ${soalHTML}
        ${jawabanHTML}
        ${infoHTML}
    </article>
    `;
}

/* =========================
   FUNGSI TAMPILKAN ERROR
========================= */
function showError(title, message) {
    const detail = document.getElementById("detail");
    detail.innerHTML = `
    <div class="error">
        <div class="error-icon">❌</div>
        <h2>${escapeHTML(title)}</h2>
        <p>${escapeHTML(message)}</p>
    </div>
    `;
}

/* =========================
   UTILITY ESCAPE HTML
========================= */
function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

/* =========================
   INITIALIZATION
========================= */
async function start() {
    const login = await checkLogin();
    if (!login) return;
    await loadMaterial();
}

start();
</script>

</body>
</html>
