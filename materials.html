<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi - Portal Pembelajaran</title>

<!-- GOOGLE FONTS (PLUS JAKARTA SANS) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET & DARK BASE STYLES
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(37, 99, 235, 0.15),
            transparent 45%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(124, 58, 237, 0.15),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #070a12,
            #0f172a,
            #1e293b
        );
    color: #f8fafc;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

/* =====================================================
   HEADER
===================================================== */

header {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 100;
}

.back {
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.back:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    transform: translateX(-3px);
}

.back:active {
    transform: scale(0.97);
}

.brand {
    font-size: 18px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.01em;
}

/* =====================================================
   CONTAINER & SUBJECT HEADER CARD
===================================================== */

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
}

.subject-box {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 28px;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
}

.subject-icon {
    font-size: 38px;
    margin-bottom: 12px;
    display: inline-block;
}

.subject-box h1 {
    font-size: 26px;
    font-weight: 800;
    color: #f8fafc;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
}

.subject-box p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
}

.subject-number {
    display: inline-flex;
    align-items: center;
    margin-top: 14px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(37, 99, 235, 0.15);
    color: #93c5fd;
    border: 1px solid rgba(59, 130, 246, 0.3);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
}

/* =====================================================
   SECTION TITLE & MATERIALS GRID
===================================================== */

.section-title {
    font-size: 20px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.materials {
    display: grid;
    gap: 14px;
}

/* =====================================================
   MATERIAL CARD
===================================================== */

.material-card {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    animation: fadeUp 0.45s ease both;
    font-family: inherit;
    color: inherit;
}

.material-card:hover {
    transform: translateY(-3px);
    background: rgba(30, 41, 59, 0.7);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 12px 30px -10px rgba(37, 99, 235, 0.25);
}

.material-card:active {
    transform: scale(0.99);
}

.material-icon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    background: rgba(37, 99, 235, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.material-info {
    flex: 1;
    min-width: 0;
}

.material-title {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    line-height: 1.4;
    word-break: break-word;
}

.material-description {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 4px;
    line-height: 1.5;
}

.arrow {
    color: #64748b;
    font-size: 24px;
    flex-shrink: 0;
    transition: all 0.2s ease;
}

.material-card:hover .arrow {
    color: #60a5fa;
    transform: translateX(4px);
}

/* =====================================================
   STATES (EMPTY, ERROR, LOADING)
===================================================== */

.empty, .error-box, .loading {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 40px 24px;
    text-align: center;
    color: #94a3b8;
    line-height: 1.7;
}

.error-box {
    background: rgba(127, 29, 29, 0.2);
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
}

.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #3b82f6;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
}

/* =====================================================
   ANIMATIONS & MEDIA QUERIES
===================================================== */

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    header { padding: 14px 16px; }
    .brand { font-size: 16px; }
    .container { padding: 20px 14px 40px; }
    .subject-box { padding: 20px; }
    .subject-box h1 { font-size: 22px; }
    .material-card { padding: 16px; }
    .material-icon { width: 44px; height: 44px; font-size: 20px; }
    .material-title { font-size: 15px; }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
    <button class="back" id="backButton">← Kembali</button>
    <div class="brand">📚 Portal Pembelajaran</div>
</header>

<!-- MAIN CONTAINER -->
<main class="container">

    <!-- SUBJECT INFORMATION -->
    <section class="subject-box">
        <div class="subject-icon">📖</div>
        <h1 id="subjectName">Memuat mata pelajaran...</h1>
        <p>Pilih materi, catatan, atau soal yang ingin kamu pelajari.</p>
        <div id="subjectNumber" class="subject-number" style="display:none;"></div>
    </section>

    <!-- MATERIAL TITLE -->
    <h2 class="section-title">📚 Daftar Materi & Soal</h2>

    <!-- MATERIAL CONTAINER -->
    <section id="materials" class="materials">
        <div class="loading">
            <div class="spinner"></div>
            Memuat materi...
        </div>
    </section>

</main>

<!-- SUPABASE & SCRIPTS -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =====================================================
   SUPABASE CLIENT & URL PARAMETERS
===================================================== */
const supabaseClient = SingleSession.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const params = new URLSearchParams(window.location.search);
const subjectId = params.get("subject_id");

/* =====================================================
   ELEMENT REFERENCES
===================================================== */
const subjectName = document.getElementById("subjectName");
const subjectNumber = document.getElementById("subjectNumber");
const materialsContainer = document.getElementById("materials");

/* =====================================================
   UTILITIES
===================================================== */
function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function goBack() {
    location.href = "subjects.html";
}

document.getElementById("backButton").addEventListener("click", goBack);

/* =====================================================
   CHECK AUTHENTICATION & PROFILE STATUS
===================================================== */
async function checkLogin() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();

    if (error || !session) {
        location.href = "index.html";
        return false;
    }

    const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("id, nama, username, role, status")
        .eq("id", session.user.id)
        .single();

    if (profileError || !profile) {
        await supabaseClient.auth.signOut({ scope: "local" });
        location.href = "index.html";
        return false;
    }

    if (profile.status !== "open") {
        await supabaseClient.auth.signOut({ scope: "local" });
        alert("Akun kamu sedang dikunci atau tidak aktif.");
        location.href = "index.html";
        return false;
    }

    if (profile.role !== "member" && profile.role !== "admin" && profile.role !== "moderator") {
        await supabaseClient.auth.signOut({ scope: "local" });
        location.href = "index.html";
        return false;
    }

    // Batasan 1 sesi hanya berlaku untuk member, bukan admin
    if (profile.role === "member" && !(await SingleSession.guard(supabaseClient))) return false;

    return true;
}

/* =====================================================
   LOAD SUBJECT METADATA
===================================================== */
async function loadSubject() {
    if (!subjectId) {
        subjectName.textContent = "Mata pelajaran tidak ditemukan";
        materialsContainer.innerHTML = `
            <div class="error-box">
                ❌ ID mata pelajaran tidak ditemukan.
                <br><br>
                Silakan kembali ke halaman Mata Pelajaran dan pilih mata pelajaran terlebih dahulu.
            </div>
        `;
        return false;
    }

    const { data, error } = await supabaseClient
        .from("subjects")
        .select("id, nama")
        .eq("id", subjectId)
        .single();

    if (error || !data) {
        subjectName.textContent = "Mata pelajaran tidak ditemukan";
        materialsContainer.innerHTML = `
            <div class="error-box">
                ❌ Mata pelajaran tidak ditemukan.
                <br><br>
                ${escapeHTML(error?.message || "Data tidak tersedia.")}
            </div>
        `;
        return false;
    }

    subjectName.textContent = data.nama;
    subjectNumber.style.display = "inline-flex";
    subjectNumber.textContent = "📚 Mata Pelajaran #" + data.id;

    return true;
}

/* =====================================================
   LOAD MATERIALS LIST
===================================================== */
async function loadMaterials() {
    materialsContainer.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Memuat materi...
        </div>
    `;

    const { data, error } = await supabaseClient
        .from("materials")
        .select("id, subject_id, judul, isi, soal, jawaban")
        .eq("subject_id", subjectId)
        .order("id", { ascending: true });

    if (error) {
        materialsContainer.innerHTML = `
            <div class="error-box">
                ❌ Gagal memuat materi.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;
        return;
    }

    if (!data || data.length === 0) {
        materialsContainer.innerHTML = `
            <div class="empty">
                📭 Belum ada materi.
                <br><br>
                Belum ada catatan atau soal untuk mata pelajaran ini.
                <br><br>
                Materi akan muncul setelah admin menambahkannya.
            </div>
        `;
        return;
    }

    materialsContainer.innerHTML = "";

    data.forEach(function(material, index) {
        const isi = typeof material.isi === "string" ? material.isi.trim() : "";
        const soal = typeof material.soal === "string" ? material.soal.trim() : "";
        const jawaban = typeof material.jawaban === "string" ? material.jawaban.trim() : "";

        const adaMateri = isi !== "";
        const adaSoal = soal !== "";
        const adaJawaban = jawaban !== "";

        const card = document.createElement("button");
        card.type = "button";
        card.className = "material-card";
        card.style.animationDelay = (index * 0.06) + "s";

        const icon = document.createElement("div");
        icon.className = "material-icon";

        if (adaMateri && adaSoal && adaJawaban) {
            icon.textContent = "📚";
        } else if (adaMateri && adaSoal) {
            icon.textContent = "📝";
        } else if (adaSoal && adaJawaban) {
            icon.textContent = "❓";
        } else if (adaMateri) {
            icon.textContent = "📘";
        } else if (adaSoal) {
            icon.textContent = "❓";
        } else {
            icon.textContent = "📖";
        }

        const info = document.createElement("div");
        info.className = "material-info";

        const title = document.createElement("div");
        title.className = "material-title";
        title.textContent = material.judul || "Tanpa judul";

        const description = document.createElement("div");
        description.className = "material-description";

        if (adaMateri && adaSoal && adaJawaban) {
            description.textContent = "📘 Catatan + 📝 Soal + 💡 Jawaban";
        } else if (adaMateri && adaSoal) {
            description.textContent = "📘 Catatan + 📝 Soal";
        } else if (adaMateri && adaJawaban) {
            description.textContent = "📘 Catatan + 💡 Jawaban";
        } else if (adaSoal && adaJawaban) {
            description.textContent = "📝 Soal + 💡 Jawaban";
        } else if (adaMateri) {
            description.textContent = "📘 Catatan / materi pembelajaran";
        } else if (adaSoal) {
            description.textContent = "📝 Soal latihan";
        } else if (adaJawaban) {
            description.textContent = "💡 Catatan jawaban";
        } else {
            description.textContent = "📖 Materi pembelajaran";
        }

        info.appendChild(title);
        info.appendChild(description);

        const arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.textContent = "›";

        card.appendChild(icon);
        card.appendChild(info);
        card.appendChild(arrow);

        card.addEventListener("click", function() {
            window.location.href = "material-detail.html?id=" + encodeURIComponent(material.id);
        });

        materialsContainer.appendChild(card);
    });
}

/* =====================================================
   AUTH STATE CHANGE LISTENER
===================================================== */
supabaseClient.auth.onAuthStateChange(function(event, session) {
    if (event === "SIGNED_OUT") {
        location.href = "index.html";
    }
});

/* =====================================================
   INITIALIZATION
===================================================== */
async function start() {
    const login = await checkLogin();
    if (!login) return;

    const subject = await loadSubject();
    if (!subject) return;

    await loadMaterials();
}

start();
</script>

</body>
</html>
