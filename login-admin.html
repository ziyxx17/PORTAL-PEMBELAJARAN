<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Portal Pembelajaran</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET & GLOBALS
        ===================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            position: relative;
            opacity: 0;
            animation: pageFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            -webkit-font-smoothing: antialiased;
        }

        /* =====================================================
           AMBIENT BACKGROUND ORBS
        ===================================================== */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            will-change: transform;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: #8b5cf6;
            top: -100px;
            right: -80px;
            animation: orbFloat1 20s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 340px;
            height: 340px;
            background: #ec4899;
            bottom: -100px;
            left: -80px;
            animation: orbFloat2 18s ease-in-out infinite alternate;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: #3b82f6;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 15s ease-in-out infinite alternate;
        }

        /* =====================================================
           LOGIN CARD (DARK GLASSMORPHISM)
        ===================================================== */
        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 1;
            transform: translateY(20px) scale(0.96);
            animation: containerPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* =====================================================
           ICON 3D EMBED (ADMIN CROWN THEME)
        ===================================================== */
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 24px;
            background: radial-gradient(circle at 30% 30%, rgba(139, 92, 246, 0.4), rgba(236, 72, 153, 0.15));
            border: 1.5px solid rgba(192, 132, 252, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 
                0 14px 30px rgba(139, 92, 246, 0.4),
                inset 0 3px 4px rgba(255, 255, 255, 0.4),
                inset 0 -4px 8px rgba(0, 0, 0, 0.4);
            animation: float3D 4s ease-in-out infinite;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s ease;
        }

        .login-box:hover .icon {
            transform: translateY(-4px) scale(1.05);
        }

        .login-box:hover .icon img {
            transform: scale(1.1) rotate(4deg);
        }

        /* =====================================================
           TYPOGRAPHY
        ===================================================== */
        h1 {
            text-align: center;
            color: #f8fafc;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            animation: fadeUp 0.6s ease 0.15s both;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
            animation: fadeUp 0.6s ease 0.2s both;
        }

        /* =====================================================
           FORM & INPUTS
        ===================================================== */
        .input-group {
            margin-bottom: 18px;
            animation: fadeUp 0.6s ease 0.25s both;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            background: rgba(15, 23, 42, 0.5);
            color: #f8fafc;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input::placeholder {
            color: #64748b;
        }

        input:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(15, 23, 42, 0.7);
        }

        input:focus {
            border-color: #c084fc;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
            transform: translateY(-1px);
        }

        /* PASSWORD WRAPPER & TOGGLE EYE BUTTON */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 4px;
            margin: 0;
            width: auto;
            height: auto;
            cursor: pointer;
            color: #94a3b8;
            box-shadow: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .toggle-password:hover {
            color: #c084fc;
            transform: translateY(-50%) scale(1.1);
            background: transparent;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =====================================================
           BUTTON
        ===================================================== */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.45);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeUp 0.6s ease 0.3s both;
            margin-top: 8px;
        }

        button[type="submit"]::after {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            transform: skewX(-20deg);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.65s ease;
        }

        button[type="submit"]:hover::after {
            left: 140%;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -4px rgba(139, 92, 246, 0.6);
        }

        button[type="submit"]:active {
            transform: translateY(0) scale(0.98);
        }

        button[type="submit"]:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* =====================================================
           BACK LINK
        ===================================================== */
        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-top: 24px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            animation: fadeUp 0.6s ease 0.35s both;
        }

        .back:hover {
            color: #c084fc;
            transform: translateX(-3px);
        }

        /* =====================================================
           MESSAGES
        ===================================================== */
        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
            animation: messageIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .error {
            background: rgba(153, 27, 27, 0.25);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .loading {
            background: rgba(88, 28, 135, 0.25);
            color: #e9d5ff;
            border: 1px solid rgba(139, 92, 246, 0.35);
        }

        .success {
            background: rgba(20, 83, 45, 0.25);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.35);
        }

        /* =====================================================
           KEYFRAME ANIMATIONS
        ===================================================== */
        @keyframes pageFadeIn {
            to { opacity: 1; }
        }

        @keyframes containerPop {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float3D {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1.5deg); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes orbFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-60px, 50px) scale(1.15); }
        }

        @keyframes orbFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -40px) scale(1.1); }
        }

        @keyframes orbFloat3 {
            0% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-40%, -60%) scale(1.1); }
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           PAGE EXIT TRANSITION
        ===================================================== */
        body.page-exit {
            pointer-events: none;
        }

        body.page-exit .login-box {
            animation: containerExit 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        body.page-exit .orb {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        @keyframes containerExit {
            to {
                opacity: 0;
                transform: translateY(-25px) scale(0.95);
                filter: blur(8px);
            }
        }

        /* =====================================================
           RESPONSIVE DESIGN
        ===================================================== */
        @media (max-width: 480px) {
            body { padding: 16px; }

            .login-box {
                padding: 32px 22px;
                border-radius: 26px;
            }

            .icon {
                width: 72px;
                height: 72px;
                font-size: 34px;
            }

            .icon img {
                width: 42px;
                height: 42px;
            }

            h1 { font-size: 23px; }
            .subtitle { font-size: 13px; margin-bottom: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Glowing Orbs Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Login Card Container -->
    <main class="login-box">

        <!-- 3D ICON ADMIN (MAHKOTA DENGAN FALLBACK AMAN) -->
        <div class="icon">
            <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis@master/Emojis/Objects/Crown.png" 
                 alt="Login Admin 3D" 
                 onerror="this.onerror=null; this.parentElement.innerHTML='👑';">
        </div>

        <!-- TITLE -->
        <h1>Login Admin</h1>
        <p class="subtitle">Masuk ke Dashboard Admin</p>

        <!-- MESSAGE -->
        <div id="message" class="message"></div>

        <!-- FORM -->
        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username Admin</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username admin"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-password" id="togglePassword" title="Tampilkan/Sembunyikan Password" aria-label="Toggle Password">
                        <!-- Icon Mata Tertutup (Default) -->
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginButton">Masuk sebagai Admin</button>

        </form>

        <!-- BACK LINK -->
        <a href="index.html" class="back" id="btnBack">
            ← Kembali ke Portal Utama
        </a>

    </main>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="login-admin.js"></script>

    <script>
        /* TOGGLE LIHAT PASSWORD (MATA) */
        const togglePasswordBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        const eyeOpenSVG = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        `;

        const eyeClosedSVG = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        `;

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener("click", function () {
                const isPassword = passwordInput.getAttribute("type") === "password";
                passwordInput.setAttribute("type", isPassword ? "text" : "password");
                eyeIcon.innerHTML = isPassword ? eyeClosedSVG : eyeOpenSVG;
            });
        }

        /* ANIMASI KEMBALI KE PORTAL UTAMA */
        const btnBack = document.getElementById('btnBack');

        if (btnBack) {
            btnBack.addEventListener('click', function(event) {
                if (event.ctrlKey || event.metaKey || event.shiftKey || event.button !== 0) {
                    return;
                }

                event.preventDefault();
                const target = this.href;

                document.body.classList.add('page-exit');

                setTimeout(function() {
                    window.location.href = target;
                }, 380);
            });
        }

        /* PAGESHOW HANDLER */
        window.addEventListener("pageshow", function() {
            document.body.classList.remove("page-exit");
        });
    </script>

</body>
</html>
